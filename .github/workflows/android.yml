name: Android APK (Godot)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-godot-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.5.1"
  GODOT_TAG: "4.5.1-stable"            # GitHub release tag
  GODOT_TEMPLATES_DIR_NAME: "4.5.1.stable"  # ~/.local/share/godot/export_templates/<this>
  GRADLE_VERSION: "8.11.1"             # for the plugin AAR (AGP 8.6.1 needs Gradle >= 8.7)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
          log-accepted-android-sdk-licenses: false

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ------------------------------------------------------------------ 1. LiveKit plugin AAR
      - name: Build NexoraLiveKit plugin AAR
        working-directory: plugin_src/livekit
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          gradle assembleRelease --no-daemon --stacktrace
          ls -la build/outputs/aar

      - name: Copy AAR into the Godot plugin folder
        run: |
          mkdir -p android/plugins/nexora_livekit
          cp plugin_src/livekit/build/outputs/aar/nexora-livekit-release.aar android/plugins/nexora_livekit/
          ls -la android/plugins/nexora_livekit

      # ------------------------------------------------------------------ 2. Godot + export templates
      - name: Cache Godot editor + Android templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_TEMPLATES_DIR_NAME }}
          key: godot-${{ env.GODOT_TAG }}-android-v1

      - name: Download Godot ${{ env.GODOT_VERSION }} + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_TAG}"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o /tmp/godot.zip "$base/Godot_v${GODOT_TAG}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_TAG}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot
          rm /tmp/godot.zip
          # The .tpz is ~1.3 GB; keep only what an Android (gradle) export needs.
          curl -fsSL --retry 3 -o /tmp/templates.tpz "$base/Godot_v${GODOT_TAG}_export_templates.tpz"
          tdir=~/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR_NAME}
          mkdir -p "$tdir"
          unzip -q -j /tmp/templates.tpz \
            templates/version.txt templates/android_source.zip \
            templates/android_debug.apk templates/android_release.apk -d "$tdir"
          rm /tmp/templates.tpz
          ls -la "$tdir"

      - name: Put godot on PATH
        run: |
          echo "$HOME/godot" >> "$GITHUB_PATH"
          ~/godot/godot --version

      # ------------------------------------------------------------------ 3. Signing + editor settings
      - name: Keystores (debug generated; release from secrets or the debug one)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p ~/keys
          keytool -genkeypair -v -keystore ~/keys/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" -noprompt
          if [ -n "${KS_B64:-}" ] && [ -n "${KS_USER:-}" ] && [ -n "${KS_PASS:-}" ]; then
            echo "$KS_B64" | base64 -d > ~/keys/release.keystore
            echo "Using release keystore from secrets"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KS_USER"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KS_PASS"
            } >> "$GITHUB_ENV"
          else
            echo "No release keystore secrets: signing the release APK with the debug keystore (testing only)"
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/keys/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/keys/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"

      - name: Godot editor settings (Android SDK, Java, debug keystore)
        run: |
          set -euo pipefail
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.5.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/debug_keystore = "${HOME}/keys/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = false
          EOT
          cat ~/.config/godot/editor_settings-4.5.tres

      # ------------------------------------------------------------------ 4. Project tweaks (CI only)
      - name: Enable the NexoraLiveKit editor plugin + stamp version code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, os
          p = "project.godot"
          s = open(p, encoding="utf-8").read()
          want = "res://addons/nexora_livekit/plugin.cfg"
          if want not in s:
              if "[editor_plugins]" in s:
                  s = re.sub(r'(\[editor_plugins\][^\[]*?enabled=PackedStringArray\()', r'\1"%s", ' % want, s, count=1)
                  s = s.replace(', )', ')')
              else:
                  s = s.rstrip("\n") + '\n\n[editor_plugins]\n\nenabled=PackedStringArray("%s")\n' % want
              open(p, "w", encoding="utf-8").write(s)
              print("enabled editor plugin in project.godot (CI copy)")
          e = "export_presets.cfg"
          t = open(e, encoding="utf-8").read()
          t = re.sub(r'(?m)^version/code=\d+$', "version/code=%s" % os.environ["GITHUB_RUN_NUMBER"], t)
          open(e, "w", encoding="utf-8").write(t)
          PY
          grep -n "editor_plugins" -A2 project.godot
          grep -n "version/code" export_presets.cfg

      # ------------------------------------------------------------------ 5. Import, test, export
      - name: Import project
        run: |
          timeout 900 godot --headless --import || echo "import exited with $? (continuing)"
          ls .godot | head

      - name: Headless tests (non-blocking)
        continue-on-error: true
        run: |
          if [ -f tests/bot_match.gd ]; then timeout 600 godot --headless -s res://tests/bot_match.gd; fi
          if [ -f tests/voice_smoke.gd ]; then timeout 120 godot --headless -s res://tests/voice_smoke.gd; fi

      - name: Export release APK (arm64-v8a, gradle build)
        run: |
          set -euo pipefail
          mkdir -p build
          godot --headless --install-android-build-template --export-release "Android" build/NEXORA.apk 2>&1 | tee build/export.log
          test -s build/NEXORA.apk || { echo "::error::APK not produced"; exit 1; }
          ls -la build/NEXORA.apk
          unzip -l build/NEXORA.apk | grep -E "lib/arm64-v8a/.*(godot|jingle|webrtc|livekit)" || true
          unzip -p build/NEXORA.apk AndroidManifest.xml > /dev/null

      - name: Verify APK signature
        run: |
          bt="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$bt/apksigner" verify --print-certs build/NEXORA.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-apk
          path: build/NEXORA.apk
          if-no-files-found: error

      - name: Upload export log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log
          path: |
            build/export.log
            android/build/build/reports/**
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NEXORA build ${{ github.run_number }}
          body: |
            NEXORA (Godot ${{ env.GODOT_VERSION }}) Android build, arm64-v8a.
            Signed with the CI debug keystore unless release keystore secrets are configured (testing only).
            Commit: ${{ github.sha }}
            Install: download the APK on your Android phone and allow "install unknown apps".
          files: build/NEXORA.apk
          make_latest: true
